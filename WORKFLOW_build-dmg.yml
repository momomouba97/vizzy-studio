name: Build Vizzy Studio DMG (Intel)

on:
  workflow_dispatch:

jobs:
  build:
    # Intel (x86_64) macOS runner -> DMG that runs on your Intel Mac with macOS 11
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check bundled FFmpeg
        run: |
          node -e "const p=require('ffmpeg-static');console.log('ffmpeg at',p)"
          "$(node -p "require('ffmpeg-static')")" -hide_banner -encoders | grep -E "libx264|videotoolbox" || true

      - name: Build DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: List output
        run: ls -lh dist

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Vizzy-Studio-DMG
          path: dist/*.dmg
          if-no-files-found: error
